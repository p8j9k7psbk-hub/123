<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intimate Dynamics Test</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#fafafa;--card:#fff;--text:#1a1a1a;--sub:#999;--accent:#2d2d2d;
--agree:#4a6741;--disagree:#8b4a4a;--bar:#e0e0e0;--fill:#2d2d2d;
--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.04);
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden}

/* progress bar */
.progress-wrap{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--bar);z-index:100}
.progress-fill{height:100%;width:0;background:var(--fill);transition:width .4s cubic-bezier(.4,0,.2,1)}

/* layout */
.container{max-width:640px;margin:0 auto;padding:60px 24px 80px}

/* intro */
.intro{text-align:center;animation:fadeUp .8s ease}
.intro h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
.intro .cn-title{font-family:'Noto Sans SC',sans-serif;font-weight:300;font-size:1rem;color:var(--sub);margin-bottom:32px}
.intro p{font-size:.92rem;color:#666;line-height:1.7;max-width:440px;margin:0 auto 40px}
.btn-start{display:inline-block;padding:14px 48px;background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-start:hover{background:#444;transform:translateY(-1px)}

/* question card */
.question-card{display:none;animation:fadeUp .5s ease}
.question-card.active{display:block}
.q-number{font-size:.75rem;color:var(--sub);letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px}
.q-en{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;line-height:1.45;margin-bottom:10px}
.q-cn{font-family:'Noto Sans SC',sans-serif;font-size:.88rem;color:var(--sub);font-weight:300;line-height:1.6;margin-bottom:40px}

/* scale */
.scale-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.scale-labels{display:flex;justify-content:space-between;width:100%;max-width:380px}
.scale-labels span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.scale-labels .lbl-agree{color:var(--agree)}
.scale-labels .lbl-disagree{color:var(--disagree)}
.scale-circles{display:flex;align-items:center;justify-content:center;gap:14px}
.circle-btn{border:2px solid #d0d0d0;background:transparent;border-radius:50%;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative}
.circle-btn:hover{border-color:#999;background:rgba(0,0,0,.03)}
.circle-btn.selected{border-color:var(--fill);background:var(--fill)}
.circle-btn.selected.agree-zone{border-color:var(--agree);background:var(--agree)}
.circle-btn.selected.disagree-zone{border-color:var(--disagree);background:var(--disagree)}
.c1{width:40px;height:40px}.c2{width:34px;height:34px}.c3{width:28px;height:28px}.c4{width:22px;height:22px}

/* nav */
.nav-row{display:flex;justify-content:space-between;margin-top:48px}
.nav-btn{padding:10px 28px;border:1.5px solid var(--bar);background:transparent;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--sub);transition:all .25s}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-btn.primary:hover{background:#444}

/* result */
.result-page{display:none;text-align:center;animation:fadeUp .7s ease}
.result-page.active{display:block}
.result-type-code{font-family:'Playfair Display',serif;font-size:3.2rem;font-weight:900;letter-spacing:.05em;margin-bottom:4px}
.result-type-cn{font-family:'Noto Sans SC',sans-serif;font-size:1.1rem;color:var(--sub);font-weight:400;margin-bottom:28px}
.result-summary{font-size:1rem;font-style:italic;color:#555;line-height:1.6;margin-bottom:36px;max-width:480px;margin-left:auto;margin-right:auto}

.result-section{text-align:left;margin-bottom:28px;padding:24px 28px;background:var(--card);border-radius:8px;box-shadow:var(--shadow)}
.result-section h3{font-family:'DM Sans',sans-serif;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sub);margin-bottom:12px;font-weight:600}
.result-section p{font-size:.9rem;line-height:1.75;color:#444;font-family:'Noto Sans SC','DM Sans',sans-serif;font-weight:300}

.tags-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.tag{padding:6px 16px;border:1px solid #ddd;border-radius:20px;font-size:.78rem;color:#666;font-weight:500;letter-spacing:.03em}

.btn-retry{display:inline-block;padding:14px 48px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-retry:hover{background:var(--accent);color:#fff}

/* dimension bars */
.dim-bar-wrap{margin-bottom:16px}
.dim-bar-wrap:last-child{margin-bottom:0}
.dim-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--sub);margin-bottom:6px}
.dim-track{width:100%;height:6px;background:var(--bar);border-radius:3px;overflow:hidden}
.dim-fill{height:100%;border-radius:3px;transition:width .6s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
  .intro h1{font-size:1.8rem}
  .q-en{font-size:1.15rem}
  .scale-circles{gap:10px}
  .c1{width:34px;height:34px}.c2{width:29px;height:29px}.c3{width:24px;height:24px}.c4{width:19px;height:19px}
  .result-type-code{font-size:2.4rem}
  .container{padding:50px 18px 60px}
}
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

<div class="container">
  <!-- INTRO -->
  <div class="intro" id="introPage">
    <h1>Intimate Dynamics</h1>
    <div class="cn-title">亲密关系深层倾向测试</div>
    <p>20 道题，不需要思考太久。<br>选让你身体先于大脑反应的那个答案。<br>没有对错，只有你还没说出口的偏好。</p>
    <button class="btn-start" onclick="startTest()">Begin Test</button>
  </div>

  <!-- QUESTIONS -->
  <div id="questionsWrap"></div>

  <!-- RESULT -->
  <div class="result-page" id="resultPage"></div>
</div>

<script>
const questions = [
  // Dimension 1: 谁来主导节奏
  {en:"When someone decides for me what we're doing tonight, my first instinct is relief.",
   cn:"当有人替我决定今晚做什么，我的第一反应是松了一口气。", dim:0},
  {en:"I find myself arranging the other person's schedule without being asked.",
   cn:"我会不自觉地替对方安排好一切，没人要求我这么做。", dim:0},
  {en:"If no one takes control, I get restless — not bored, restless.",
   cn:"如果没有人掌控局面，我会变得焦躁——不是无聊，是焦躁。", dim:0},
  {en:"I prefer to set the pace even when I pretend I don't care.",
   cn:"即使我假装无所谓，其实我更想掌握节奏。", dim:0, reverse:true},

  // Dimension 2: 对被支配/被命令的真实反应
  {en:"Being told 'don't move' by someone I trust makes me calmer, not more tense.",
   cn:"被信任的人说「别动」，会让我更平静，而不是更紧张。", dim:1},
  {en:"A firm tone aimed at me doesn't trigger defiance — it triggers attention.",
   cn:"强硬的语气对着我来，激起的不是反抗，而是注意力。", dim:1},
  {en:"I've caught myself wanting to be interrupted mid-sentence and corrected.",
   cn:"我发现自己有时候想在说到一半的时候被打断、被纠正。", dim:1},
  {en:"I feel more like myself when someone else is holding the frame.",
   cn:"当别人在掌控大局的时候，我反而更像我自己。", dim:1},

  // Dimension 3: 主动给予 vs 被动承受
  {en:"Watching someone enjoy what I've done for them is better than any compliment.",
   cn:"看到对方享受我为他们做的事，比任何夸奖都让我满足。", dim:2, reverse:true},
  {en:"I would rather receive without negotiation than give with full control.",
   cn:"比起完全掌控地给予，我更想毫不犹豫地接受。", dim:2},
  {en:"The idea of someone studying exactly how to please me is unsettling — in a good way.",
   cn:"有人在仔细研究怎么取悦我这个想法令我不安——是好的那种不安。", dim:2},
  {en:"I get more satisfaction from anticipating needs than from having mine anticipated.",
   cn:"比起被人猜中需求，我更享受猜中别人的需求。", dim:2, reverse:true},

  // Dimension 4: 信任后才打开 vs 直接打开
  {en:"I can let someone see me at my worst only after months, never on a first meeting.",
   cn:"我需要好几个月才能让一个人看到我最差的样子，初见绝不可能。", dim:3},
  {en:"My body tenses up with new people even when my words say 'I'm fine.'",
   cn:"面对新的人，即使嘴上说「我很好」，身体还是会绷紧。", dim:3},
  {en:"I've been told I reveal too much too fast, and I didn't see the problem.",
   cn:"有人说我太快暴露太多，但我不觉得这有什么问题。", dim:3, reverse:true},
  {en:"Trust for me is not a switch — it's a dial I turn very slowly.",
   cn:"信任对我来说不是开关，是一个我转得很慢的旋钮。", dim:3},

  // Dimension 5: 用"不"来测试 vs 直接表达边界
  {en:"Sometimes I say 'no' just to see if they'll stay.",
   cn:"有时候我说「不要」，只是想看他们会不会留下来。", dim:4},
  {en:"I've pushed someone away to check whether they'd push back.",
   cn:"我推开过一个人，只是为了看他们会不会推回来。", dim:4},
  {en:"When I set a boundary, it means exactly what it says — no hidden test.",
   cn:"当我划下界限，那就是字面意思——没有隐藏的考验。", dim:4, reverse:true},
  {en:"I need people to prove they can handle my worst before I show them my best.",
   cn:"我需要别人先证明他们能承受我最糟糕的样子，再让他们看到最好的。", dim:4},
];

// Result types
const resultTypes = [
  {
    code:"YIELD",
    cn:"潮汐型 · 退让者",
    summary:"你在关系中的本能是让出空间——不是因为软弱，而是因为你从被引导中获得真实的安全感。",
    personality:"你很少争夺主导权，不是不能，是不想。你对强势的人有天然的信任倾向，容易在对方坚定的语气里找到一种奇怪的安心。你的服从不是讨好，而是一种选择——你挑人，挑得很严。一旦选定，你愿意交出的远比多数人想象得多。但你不会让任何人知道这件事有多容易。",
    intimacy:"在亲密关系里你很安静，但你的安静是有重量的。你不太会主动索取，却会在对方主动给予时毫不掩饰地接受。被看穿需求的瞬间让你紧张，但也让你上瘾。",
    boundary:"你的底线藏得很深，但一旦被触到，你的离开比任何人都干脆。你不吵架，你消失。",
    tags:["被引导时最放松","安静的接受者","需要被读懂","信任是慢热开关","不争不代表不在意"]
  },
  {
    code:"HELM",
    cn:"锚点型 · 掌舵者",
    summary:"你是那个自然而然拿起方向盘的人——不是为了控制，而是因为你没法忍受没人在开。",
    personality:"你习惯替别人想好下一步，有时候对方还没开口你就已经安排好了。你的照顾方式是预判，你的爱意藏在那些「我帮你想过了」的细节里。你害怕失控，但你更害怕承认你害怕失控。掌控感对你来说不是权力，是一种让你能正常呼吸的结构。",
    intimacy:"你在关系里是搭建框架的人。你会制造节奏感，让对方在你的节奏里觉得安全。你给予时不需要被感谢，但你需要对方顺从你精心设计的节奏——哪怕他们不知道那是你设计的。",
    boundary:"你的边界不是一条线，是一整套规则。你很少说出口，但你会在对方触碰到的时候用沉默让他们知道。",
    tags:["天生的节奏制造者","照顾即控制","预判型关爱","害怕承认脆弱","安静的规则制定者"]
  },
  {
    code:"THORN",
    cn:"荆棘型 · 试探者",
    summary:"你用拒绝来确认连接——如果他们穿过你的刺还留下来，那才算数。",
    personality:"你知道自己难搞，有时候甚至故意让自己更难搞。你的推开不是真的想让对方走，而是一种压力测试：你需要看到对方在你最不可爱的时候依然选择留下。这不是游戏，是你唯一能信任的验证方式。你内心深处相信真正的爱应该经得起你最差的版本。",
    intimacy:"你在关系初期会制造大量摩擦，说反话、考验耐心、故意消失。通过测试的人会看到一个完全不同的你——柔软、依赖、几乎是另一个人。但通过测试的门槛，你自己都觉得太高了。",
    boundary:"你的边界是流动的，有时你自己都分不清哪些是真正的底线，哪些只是另一场测试。这是你最需要面对的课题。",
    tags:["推开是为了确认","压力测试型依恋","难搞是保护色","通过考验后截然不同","边界与测试的模糊地带"]
  },
  {
    code:"GLASS",
    cn:"透明型 · 直觉者",
    summary:"你一打开就是全开——不是没有边界，是你觉得藏着本身才是最大的风险。",
    personality:"你很快就会把自己摊开给对方看，包括那些大多数人需要几个月才会说出的事。你不是不谨慎，你只是相信真实感本身就是筛选——受不了真实的你的人，早走比晚走好。你的透明有时会吓到别人，但你宁可吓走一个人也不愿意花三个月演一个更安全的版本。",
    intimacy:"你在关系里几乎没有「逐步加深」的概念，你的深度从一开始就在那里。你需要的不是慢慢被了解，而是对方有能力接住你一次性给出的全部信息量。你最怕的不是受伤，是对方只爱那个你收敛后的样子。",
    boundary:"你的边界非常清晰，而且你会直说。你不测试、不暗示、不等对方猜。但你对模糊的边界极度没有耐心。",
    tags:["全开式信任","真实感即筛选","深度从不递进","怕被爱的只是表面","清晰直接的边界感"]
  }
];

let current = 0;
let answers = new Array(20).fill(null);
const dimCount = [4,4,4,4,4]; // questions per dimension

function startTest(){
  document.getElementById('introPage').style.display='none';
  renderQuestion(0);
  updateProgress();
}

function renderQuestion(idx){
  const wrap = document.getElementById('questionsWrap');
  const q = questions[idx];
  // circle sizes: 1=largest ... 4=smallest ... 7=largest (mirrored)
  const sizes = ['c1','c2','c3','c4','c3','c2','c1'];
  let circlesHTML = '';
  for(let i=0;i<7;i++){
    const zone = i<3?'agree-zone':i>3?'disagree-zone':'';
    const sel = answers[idx]===i?'selected '+zone:'';
    circlesHTML += `<button class="circle-btn ${sizes[i]} ${sel} ${zone}" data-val="${i}" onclick="selectAnswer(${idx},${i},this)"></button>`;
  }
  wrap.innerHTML = `
    <div class="question-card active">
      <div class="q-number">Question ${idx+1} / 20</div>
      <div class="q-en">${q.en}</div>
      <div class="q-cn">${q.cn}</div>
      <div class="scale-wrap">
        <div class="scale-labels">
          <span class="lbl-agree">Agree 同意</span>
          <span class="lbl-disagree">Disagree 不同意</span>
        </div>
        <div class="scale-circles">${circlesHTML}</div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" onclick="prevQ()" ${idx===0?'disabled':''}>Back</button>
        <button class="nav-btn primary" id="nextBtn" onclick="nextQ()" ${answers[idx]===null?'disabled':''}>${idx===19?'See Results':'Next'}</button>
      </div>
    </div>`;
  current = idx;
  updateProgress();
}

function selectAnswer(qIdx, val, el){
  answers[qIdx] = val;
  const circles = el.parentElement.querySelectorAll('.circle-btn');
  circles.forEach(c=>{
    c.classList.remove('selected');
    c.classList.remove('agree-zone','disagree-zone');
  });
  el.classList.add('selected');
  const i = val;
  if(i<3) el.classList.add('agree-zone');
  else if(i>3) el.classList.add('disagree-zone');
  document.getElementById('nextBtn').disabled = false;
}

function nextQ(){
  if(current<19) renderQuestion(current+1);
  else showResult();
}
function prevQ(){
  if(current>0) renderQuestion(current-1);
}

function updateProgress(){
  const answered = answers.filter(a=>a!==null).length;
  document.getElementById('progressFill').style.width = (answered/20*100)+'%';
}

function showResult(){
  document.getElementById('questionsWrap').innerHTML='';
  // Calculate dimension scores (0=high agree/submissive ... 6=high disagree)
  // For each dimension, average the answer values
  // Reverse-scored items: agree means dominant/open/direct, so we flip
  const dimScores = [0,0,0,0,0];
  const dimCounts = [0,0,0,0,0];
  questions.forEach((q,i)=>{
    let v = answers[i]; // 0(agree)..6(disagree)
    if(q.reverse) v = 6 - v; // flip so higher = more submissive/receptive/guarded/testing
    dimScores[q.dim] += v;
    dimCounts[q.dim]++;
  });
  for(let d=0;d<5;d++) dimScores[d] = dimScores[d]/dimCounts[d]; // 0-6 scale

  // Determine type
  // dim0: who leads (high=want to be led)
  // dim1: response to dominance (high=receptive)
  // dim2: give vs receive (high=prefer receiving)
  // dim3: trust speed (high=slow/guarded)
  // dim4: testing behavior (high=tests with 'no')
  const submissive = (dimScores[0]+dimScores[1]+dimScores[2])/3;
  const guarded = dimScores[3];
  const testing = dimScores[4];

  let typeIdx;
  if(testing > 3.8 && guarded > 3){
    typeIdx = 2; // THORN
  } else if(guarded < 2.5 && submissive < 3.5){
    typeIdx = 3; // GLASS
  } else if(submissive >= 3.5){
    typeIdx = 0; // YIELD
  } else {
    typeIdx = 1; // HELM
  }

  const t = resultTypes[typeIdx];
  const dimLabels = [
    ['主导节奏','Lead'],['被支配反应','Receptivity'],['给予/承受','Give vs Receive'],
    ['信任速度','Trust Speed'],['测试倾向','Testing']
  ];
  const dimColors = ['#4a6741','#5a6378','#8b6a4a','#6a5a8b','#8b4a4a'];

  let dimBarsHTML = '';
  dimScores.forEach((s,i)=>{
    const pct = Math.round(s/6*100);
    dimBarsHTML += `<div class="dim-bar-wrap">
      <div class="dim-label"><span>${dimLabels[i][0]}</span><span>${dimLabels[i][1]} ${pct}%</span></div>
      <div class="dim-track"><div class="dim-fill" style="width:${pct}%;background:${dimColors[i]}"></div></div>
    </div>`;
  });

  let tagsHTML = '';
  t.tags.forEach(tag=>{ tagsHTML += `<span class="tag">${tag}</span>`; });

  const rp = document.getElementById('resultPage');
  rp.innerHTML = `
    <div class="result-type-code">${t.code}</div>
    <div class="result-type-cn">${t.cn}</div>
    <div class="result-summary">"${t.summary}"</div>
    <div class="tags-wrap">${tagsHTML}</div>
    <div class="result-section">
      <h3>Dimension Scores / 维度得分</h3>
      ${dimBarsHTML}
    </div>
    <div class="result-section">
      <h3>Personality / 性格描述</h3>
      <p>${t.personality}</p>
    </div>
    <div class="result-section">
      <h3>In Intimacy / 亲密关系中</h3>
      <p>${t.intimacy}</p>
    </div>
    <div class="result-section">
      <h3>Boundaries / 边界</h3>
      <p>${t.boundary}</p>
    </div>
    <button class="btn-retry" onclick="retry()">Retry / 再测一次</button>
  `;
  rp.classList.add('active');
  document.getElementById('progressFill').style.width='100%';
  window.scrollTo({top:0,behavior:'smooth'});
}

function retry(){
  answers = new Array(20).fill(null);
  current = 0;
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('resultPage').innerHTML='';
  document.getElementById('introPage').style.display='';
  document.getElementById('introPage').style.animation='fadeUp .5s ease';
  document.getElementById('progressFill').style.width='0';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
